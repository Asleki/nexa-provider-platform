<!doctype html>
<html lang="en" data-application-version="0.1.0" data-runtime-mode="development" data-environment-name="development" data-build-reference="local-development">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NexiLabs NoveGeo PWA application shell.">
  <title>NexiLabs NoveGeo PWA</title>
  <link rel="stylesheet" href="./styles/app.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <main id="nexilabs-app" class="application-shell" data-application-status="CREATED" data-runtime-mode="development">
    <section class="health-panel" aria-labelledby="application-title">
      <p class="eyebrow">NexiLabs</p>
      <h1 id="application-title">NoveGeo PWA</h1>
      <p class="summary">Frontend runtime foundation</p>
      <dl class="health-grid">
        <div><dt>Status</dt><dd data-role="application-status" data-health-status="CREATED" aria-live="polite">Created</dd></div>
        <div><dt>Runtime</dt><dd data-role="runtime-mode">development</dd></div>
        <div><dt>Version</dt><dd data-role="application-version">0.1.0</dd></div>
      </dl>
      <noscript>This application requires JavaScript to start.</noscript>
    </section>
  </main>
</body>
</html>
