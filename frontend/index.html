<!doctype html>
<html lang="en" data-application-version="0.1.0" data-runtime-mode="development" data-environment-name="development" data-build-reference="local-development">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="NexiLabs application shell for governed production access, simulation and evolving platform systems.">
  <meta name="theme-color" content="#0D1B2A">
  <meta name="application-name" content="NexiLabs PWA">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="./public/manifest.webmanifest">
  <link rel="icon" href="./public/brand/nexilabs/icons/favicon.ico">
  <link rel="apple-touch-icon" href="./public/brand/nexilabs/icons/apple-touch-icon.png">
  <title>NexiLabs</title>
  <link rel="stylesheet" href="./public/brand/nexilabs/metadata/brand-tokens.css">
  <link rel="stylesheet" href="./styles/app.css">
  <script type="module" src="./src/main.js"></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Skip to main content</a>
  <div id="nexilabs-app" class="application-shell" data-application-status="CREATED" data-environment-name="development">
    <div data-shell-slot="header" aria-live="polite"></div>

    <main id="main-content" class="application-main" tabindex="-1">
      <div class="application-page" data-role="application-page" aria-live="polite">
        <section class="entry-page" aria-labelledby="loading-title">
          <p class="eyebrow">NexiLabs</p>
          <h1 id="loading-title">Starting NexiLabs</h1>
          <p class="summary">Preparing the application shell.</p>
        </section>
      </div>
      <noscript>This application requires JavaScript to start.</noscript>
    </main>

    <div data-shell-slot="footer" aria-live="polite"></div>
  </div>
</body>
</html>
